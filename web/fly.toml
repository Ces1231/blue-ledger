app = "blue-ledger-web"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[env]
  # Uses Fly.io private networking (6PN) - no extra TLS hop, stays within the org
  API_UPSTREAM = "blue-ledger-api.internal:8080"
