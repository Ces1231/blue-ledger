# .github/workflows/deploy-staging.yml
# Blue Ledger — Staging deploy pipeline
#
# Triggered ONLY when the CI workflow completes successfully on master.
# This prevents deploying broken code — CI must pass first.

name: Deploy to Staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  # ── Job 1: Deploy Go API to Fly.io ────────────────────────────────────
  deploy-api:
    name: Deploy API to Fly.io (staging)
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    defaults:
      run:
        working-directory: blue-ledger-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        id: deploy
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning::FLY_API_TOKEN secret not set — deploy skipped."
            echo "To enable: Settings → Secrets → Actions → New secret: FLY_API_TOKEN"
            echo "Get a token at: https://fly.io/user/personal_access_tokens"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          flyctl deploy --remote-only
          echo "deployed=true" >> "$GITHUB_OUTPUT"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Post-deploy smoke test
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          curl --fail --retry 5 --retry-delay 3 --retry-all-errors \
            https://blue-ledger-api.fly.dev/v1/healthz

  # ── Job 2: Web Deploy (placeholder) ──────────────────────────────────
  # The React frontend does not yet have a deploy target configured.
  # Options: Fly.io (add a fly.toml to web/ and FLY_API_TOKEN_WEB secret),
  #          Cloudflare Pages, Vercel, or Netlify.
  #
  # To enable Cloudflare Pages:
  #   1. Connect the GitHub repo in the Cloudflare dashboard
  #   2. Set build command: cd web && npm run build
  #   3. Set output dir: web/dist
  #   4. Set VITE_API_BASE_URL env var to https://blue-ledger-api.fly.dev
  deploy-web:
    name: Deploy Web (not yet configured)
    runs-on: ubuntu-latest
    needs: deploy-api
    if: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Web deploy stub
        run: |
          echo "Web deploy not configured — see job comments for options."
