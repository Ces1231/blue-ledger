# .github/workflows/deploy-staging.yml
# Blue Ledger — Staging deploy pipeline
#
# Triggered ONLY when the CI workflow completes successfully on master.
# This prevents deploying broken code — CI must pass first.

name: Deploy to Staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  # ── Job 1: Deploy Go API to Fly.io ────────────────────────────────────
  deploy-api:
    name: Deploy API to Fly.io (staging)
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    defaults:
      run:
        working-directory: blue-ledger-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        id: deploy
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning::FLY_API_TOKEN secret not set — deploy skipped."
            echo "To enable: Settings → Secrets → Actions → New secret: FLY_API_TOKEN"
            echo "Get a token at: https://fly.io/user/personal_access_tokens"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          flyctl deploy --remote-only
          echo "deployed=true" >> "$GITHUB_OUTPUT"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Post-deploy smoke test
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          curl --fail --retry 5 --retry-delay 3 --retry-all-errors \
            https://blue-ledger-api.fly.dev/v1/healthz

  # ── Job 2: Deploy React frontend to Vercel ────────────────────────────
  deploy-web:
    name: Deploy Web to Vercel
    runs-on: ubuntu-latest
    needs: deploy-api
    if: github.event.workflow_run.conclusion == 'success'

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel
        run: |
          npx vercel deploy \
            --prod \
            --yes \
            --token "$VERCEL_TOKEN" \
            2>&1 | tee /tmp/vercel-output.txt
          DEPLOY_URL=$(grep -oP 'https://[a-zA-Z0-9._/-]+\.vercel\.app' /tmp/vercel-output.txt | tail -1)
          echo "Deployed to: $DEPLOY_URL"
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
