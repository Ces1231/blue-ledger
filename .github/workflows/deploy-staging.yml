# .github/workflows/deploy-staging.yml
# Generated by Falcon — CI/CD Intelligence Agent
# Blue Ledger — Staging deploy pipeline
#
# Triggered ONLY when the CI workflow completes successfully on master.
# This prevents deploying broken code — CI must pass first.

name: Deploy to Staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  # ── Job 1: Deploy Go API to Fly.io ────────────────────────────────────
  deploy-api:
    name: Deploy API to Fly.io (staging)
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    defaults:
      run:
        working-directory: blue-ledger-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Post-deploy smoke test
        run: curl --fail --retry 5 --retry-delay 3 https://blue-ledger-api.fly.dev/v1/healthz

  # ── Job 2: Web Deploy (placeholder) ──────────────────────────────────
  # The React frontend does not yet have a deploy target configured.
  # Options: Fly.io (add a fly.toml to web/ and FLY_API_TOKEN_WEB secret),
  #          Cloudflare Pages, Vercel, or Netlify.
  #
  # This job is intentionally skipped with `if: false`.
  # It is NOT a failure — it is a placeholder for when web deploy is configured.
  # To enable: remove `if: false`, add a fly.toml to web/, and add the
  # FLY_API_TOKEN_WEB secret in the repo settings.
  deploy-web:
    name: Deploy Web (not yet configured)
    runs-on: ubuntu-latest
    needs: deploy-api
    if: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build web Docker image
        run: docker build -t blue-ledger-web:staging ./web

      - name: Web deploy stub
        run: |
          echo "Web deploy not configured."
          echo "Add FLY_API_TOKEN_WEB secret and a fly.toml in web/ to enable Fly.io deploy."
          echo "Alternatively, connect this repo to Cloudflare Pages, Vercel, or Netlify."
