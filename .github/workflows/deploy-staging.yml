# .github/workflows/deploy-staging.yml
# Generated by Falcon — CI/CD Intelligence Agent
# Blue Ledger — Staging deploy pipeline
# Runs only on push to master (not PRs).
# Deploys Go API to Fly.io and runs a post-deploy health check.

name: Deploy to Staging

on:
  push:
    branches: [master]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Deploy API to Fly.io (staging)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    defaults:
      run:
        working-directory: blue-ledger-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Post-deploy smoke test
        run: curl --fail https://blue-ledger-api.fly.dev/v1/healthz || exit 1
