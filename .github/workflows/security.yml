# .github/workflows/security.yml
# Security scanning: govulncheck (Go CVEs) + TruffleHog (secrets)
# Runs on PRs to master and on pushes to master.

name: Security Scan

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  # ── Go Vulnerability Scan ─────────────────────────────────────────────
  govulncheck:
    name: Go Vulnerability Scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: blue-ledger-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: blue-ledger-api/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # ── Secrets Detection ─────────────────────────────────────────────────
  # TruffleHog does not publish a stable floating @v3 tag — @main is the
  # reference their documentation recommends for GitHub Actions.
  # base/head use event-specific SHAs so push-to-master doesn't produce
  # base == HEAD (which causes TruffleHog to exit with an error).
  secrets-scan:
    name: Secrets Detection (TruffleHog)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog (push)
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified

      - name: Run TruffleHog (PR)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.base_ref }}
          head: HEAD
          extra_args: --only-verified
