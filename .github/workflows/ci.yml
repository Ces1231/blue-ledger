# .github/workflows/ci.yml
# Generated by Falcon — CI/CD Intelligence Agent
# Blue Ledger — Main CI pipeline
# Runs on all PRs and pushes to master.
# All three jobs must pass before deploy-staging.yml is allowed to run.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Go API ─────────────────────────────────────────────────────
  go-api:
    name: Go API — Build, Vet & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: blue_ledger_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/blue_ledger_test?sslmode=disable

    defaults:
      run:
        working-directory: blue-ledger-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: blue-ledger-api/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v -race -timeout 120s -coverprofile=coverage.out

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: blue-ledger-api/coverage.out
          retention-days: 7

  # ── Job 2: React Frontend ─────────────────────────────────────────────
  react-frontend:
    name: React Frontend — Type-check, Lint, Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # ── Job 3: Docker Build Verification ─────────────────────────────────
  docker-build:
    name: Docker — Build Verification (no push)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Go API image
        run: docker build -t blue-ledger-api:ci ./blue-ledger-api

      - name: Build React web image
        run: docker build -t blue-ledger-web:ci ./web
