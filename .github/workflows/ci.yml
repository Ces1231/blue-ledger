# .github/workflows/ci.yml
# Generated by Falcon — CI/CD Intelligence Agent
# Blue Ledger — Main CI pipeline
# Runs on all PRs and pushes to master.
# Go tests use -run=^$ until real test files exist (compilation verification only).

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Go API ──────────────────────────────────────────────────────────
  go-api:
    name: Go API — Build, Vet & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: blue_ledger_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/blue_ledger_test?sslmode=disable

    defaults:
      run:
        working-directory: blue-ledger-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: blue-ledger-api/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -run=^$ matches no test names, so all packages compile but no tests execute.
      # Replace with ./... -v -race once test files exist.
      - name: Test (compilation verification — no tests written yet)
        run: go test -run=^$ ./... -v -timeout 120s -coverprofile=coverage.out

      - name: Upload coverage artifact
        if: hashFiles('blue-ledger-api/coverage.out') != ''
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: blue-ledger-api/coverage.out
          retention-days: 7

  # ── React Frontend ───────────────────────────────────────────────────
  react-frontend:
    name: React Frontend — Type-check, Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
